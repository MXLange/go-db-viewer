name: go-db-viewer
arch: ${APP_ARCH}
platform: linux
version: ${APP_VERSION}
version_schema: semver
release: 1
section: devel
priority: optional
maintainer: ${MAINTAINER}
description: Interface desktop para acessar bancos SQL e MongoDB.
contents:
  - src: ${APP_BINARY}
    dst: /usr/bin/go-db-viewer
    expand: true
    file_info:
      mode: 0755
  - src: packaging/go-db-viewer.desktop
    dst: /usr/share/applications/go-db-viewer.desktop
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/go-db-viewer/README.md
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC_VERSION})
      - libgtk-3-0 | libgtk-3-0t64
      - libwebkit2gtk-4.1-0
      - libodbc2
  rpm:
    depends:
      - glibc >= ${GLIBC_VERSION}
      - libgtk-3.so.0()(64bit)
      - libwebkit2gtk-4.1.so.0()(64bit)
      - libodbc.so.2()(64bit)
